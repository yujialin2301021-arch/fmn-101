name: Fetch local movie posters

on:
  push:
    paths:
      - "scripts/fetch_posters.py"
      - ".github/workflows/fetch-posters.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  posters:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tools
        run: pip install requests pillow
      - name: Download and compress posters
        run: python scripts/fetch_posters.py
      - name: Commit posters
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posters
          if git diff --cached --quiet; then
            echo "No poster changes"
          else
            git commit -m "Add local movie posters [skip ci]"
            git push
          fi
